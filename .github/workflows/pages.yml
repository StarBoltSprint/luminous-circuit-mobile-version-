name: Play

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: SPA fallback
        run: |
          OUT=dist/client
          if [ ! -d "$OUT" ]; then
            if [ -d dist ]; then OUT=dist
            elif [ -d .output/public ]; then OUT=.output/public
            fi
          fi
          if [ -f "$OUT/_shell.html" ] && [ ! -f "$OUT/index.html" ]; then
            cp "$OUT/_shell.html" "$OUT/index.html"
          fi
          if [ -f "$OUT/index.html" ]; then cp "$OUT/index.html" "$OUT/404.html"; fi
          touch "$OUT/.nojekyll"
          echo "PAGES_OUT=$OUT" >> "$GITHUB_ENV"
          ls -la "$OUT" | head

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_OUT }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
